<style>
*{box-sizing:border-box}

.wrap{min-height:100vh;display:flex;justify-content:center;padding:28px 16px 40px}
.card{width:min(460px,100%);background:#fff;border-radius:28px;padding:30px 22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.12);text-align:center;border:1px solid #eee}

a.btn:hover{transform:translateY(-1px)}
.red{background:#e51f26} .green{background:#20b45a} .dark{background:#222} .blue{background:#1877f2} .pink{background:#d62976} .black{background:#111} .youtube{background:#e62117} .store{background:#333}
.section{font-size:12px;color:#999;margin:22px 0 10px;font-weight:700}
.footer{font-size:11px;color:#999;margin-top:20px}
</style>
